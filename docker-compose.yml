services:
  postgres:
    image: postgres:16
    container_name: secret-santa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: secret_santa
      POSTGRES_USER: santa_app
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa_app -d secret_santa"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: