name: Deploy Secret Santa Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/secret-santa/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/secret-santa/package-lock.json

      - name: Install dependencies
        working-directory: frontend/secret-santa
        run: npm ci

      - name: Build frontend
        working-directory: frontend/secret-santa
        run: npm run build

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Add server host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USERNAME@$EC2_HOST" \
            "sudo mkdir -p /var/www/secret-santa &&
             sudo chown ubuntu:ubuntu /var/www/secret-santa"

      - name: Upload frontend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/ec2_key" \
            frontend/secret-santa/dist/ \
            "$EC2_USERNAME@$EC2_HOST:/var/www/secret-santa/"

      - name: Verify Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            "$EC2_USERNAME@$EC2_HOST" \
            "sudo nginx -t"
