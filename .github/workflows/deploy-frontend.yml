name: Build and deploy Secret Santa app

on:
  push:
    branches:
      - main
    paths:
      - "frontend/secret-santa/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-santa-deployment
  cancel-in-progress: false

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/secret-santa
          file: ./frontend/secret-santa/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/secretsanta:latest
            ${{ secrets.DOCKER_USERNAME }}/secretsanta:${{ github.sha }}

      - name: Deploy image to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_TAG
          script: |
            set -eu

            echo "$DOCKER_PASSWORD" | sudo docker login \
              --username "$DOCKER_USERNAME" --password-stdin

            sudo docker pull "$DOCKER_USERNAME/secretsanta:$IMAGE_TAG"

            # Replace this app's existing container only.
            sudo docker rm -f secret-santa 2>/dev/null || true

            sudo docker run -d \
              --name secretsanta \
              --restart unless-stopped \
              -p 3000:3000 \
              "$DOCKER_USERNAME/secretsanta:$IMAGE_TAG"

            # Remove dangling images only; do not prune volumes or other containers.
            sudo docker image prune -f
